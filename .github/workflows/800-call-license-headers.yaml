# SPDX-License-Identifier: Apache-2.0

name: "800: [CALL] License Headers"
on:
  workflow_call:
    inputs:
      go-version:
        description: "Go Version:"
        type: string
        required: false
        default: "1.27.1"
      license-eye-version:
        description: "license-eye CLI module version (github.com/apache/skywalking-eyes):"
        type: string
        required: false
        default: "v0.9.0"
      custom-job-label:
        description: "Custom Job Label:"
        type: string
        required: false
        default: "License Headers"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  license-headers:
    name: "${{ inputs.custom-job-label || 'License Headers' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup GoLang
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ inputs.go-version || '1.27.1' }}
          check-latest: false

      # license-eye is installed with `go install` rather than through the
      # apache/skywalking-eyes action, whose action.yml references
      # actions/setup-go by tag, which the transitive-SHA-pinning policy
      # rejects. Installing the CLI also pins it to an exact module version.
      - name: Install license-eye
        run: go install github.com/apache/skywalking-eyes/cmd/license-eye@${{ inputs.license-eye-version || 'v0.9.0' }}

      - name: Check License Headers
        run: license-eye -c .licenserc.yaml header check

      # license-eye accepts any comment style, but a `#` header outside
      # `{{- if }}` leaves a comment-only manifest when a Helm template is
      # disabled, which fails `helm install`. Templates must start with a
      # Go-template comment instead.
      - name: Check Helm Template Headers
        env:
          WANT: "{{- /* SPDX-License-Identifier: Apache-2.0 */ -}}"
        run: |
          bad=$(find charts -path '*/templates/*' -type f ! -exec sh -c 'head -n 1 "$1" | grep -qF -- "$2"' _ {} "$WANT" \; -print 2>/dev/null || true)
          if [ -n "$bad" ]; then
            for f in $bad; do echo "::error file=$f::Helm templates must start with $WANT"; done
            exit 1
          fi
